<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年：日本の貿易図解</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff5f5;
            --card-bg: #ffffff;
            --primary-red: #e53e3e;
            --sunny-yellow: #f6e05e;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); border-top: 8px solid var(--primary-red); }
        h1 { font-size: 1.5rem; color: #c53030; }
        .status-box { background: #fffaf0; border-radius: 15px; padding: 20px; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>2026年：日本の貿易</h1>
        <p>「世界中に日本の技術を届けて、エネルギーを分けてもらう関係」</p>
        <div class="status-box">
            <i class="fas fa-ship" style="font-size: 3rem; color: #3182ce;"></i>
            <p><strong>注目の輸出：電気自動車やロボット</strong></p>
            <p>日本の新しい技術が世界で活躍中！</p>
        </div>
        <p><a href="index.html">← 1ページ目（GDPマップ）に戻る</a></p>
